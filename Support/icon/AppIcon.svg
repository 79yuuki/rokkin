<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#FF3A9D"/>
      <stop offset="0.5" stop-color="#7B2CFF"/>
      <stop offset="1" stop-color="#18C8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.48">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE4FF"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF36B"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="lockshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1A0050" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircle)">
    <circle cx="512" cy="540" r="420" fill="url(#glow)"/>
    <!-- speed stripes -->
    <g opacity="0.13" fill="#FFFFFF">
      <rect x="-200" y="250" width="1400" height="34" transform="rotate(-24 512 512)"/>
      <rect x="-200" y="330" width="1400" height="14" transform="rotate(-24 512 512)"/>
      <rect x="-200" y="800" width="1400" height="26" transform="rotate(-24 512 512)"/>
    </g>
    <!-- sound waves -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M 238 452 Q 206 560 238 668" stroke-width="26" opacity="0.9"/>
      <path d="M 174 404 Q 128 560 174 716" stroke-width="22" opacity="0.55"/>
      <path d="M 786 452 Q 818 560 786 668" stroke-width="26" opacity="0.9"/>
      <path d="M 850 404 Q 896 560 850 716" stroke-width="22" opacity="0.55"/>
    </g>
  </g>

  <!-- padlock, tilted like it's dancing -->
  <g transform="rotate(-9 512 590)" filter="url(#lockshadow)">
    <path d="M 404 480 V 392 A 108 108 0 0 1 620 392 V 480"
          fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
    <rect x="322" y="456" width="380" height="318" rx="70" fill="url(#body)"/>
    <!-- lightning bolt keyhole -->
    <path d="M 548 500 L 446 640 L 512 640 L 470 742 L 590 586 L 522 586 L 566 500 Z"
          fill="url(#bolt)" stroke="#2A0A4A" stroke-width="16" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M 752 232 L 766 274 L 808 288 L 766 302 L 752 344 L 738 302 L 696 288 L 738 274 Z"/>
    <path d="M 272 242 L 280 266 L 304 274 L 280 282 L 272 306 L 264 282 L 240 274 L 264 266 Z" opacity="0.85"/>
    <path d="M 786 772 L 794 794 L 816 802 L 794 810 L 786 832 L 778 810 L 756 802 L 778 794 Z" opacity="0.8"/>
  </g>
</svg>
